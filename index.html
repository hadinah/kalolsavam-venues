<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Map</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="map-wrapper">
    <img src="event-map.png" alt="Event Map">

    <svg id="svgMap" preserveAspectRatio="xMidYMid meet">
      <g id="zonesLayer"></g>
      <g id="landmarksLayer"></g>
      <g id="userLayer"></g>
    </svg>
  </div>

  <!-- Directional pointers -->
  <div id="pointer-overlay"></div>

  <!-- Center on Me button -->
  <button id="center-btn">Center on Me</button>

  <!-- JS files -->
  <script src="js/config.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/zones.js"></script>
  <script src="js/landmarks.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
